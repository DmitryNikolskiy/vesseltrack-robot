name: aistrack

on:
  schedule:
    - cron: "17 * * * *"    # раз в час; каждый запуск работает ~5,5 ч, следующий ждёт в очереди
  workflow_dispatch:
    inputs:
      mode:
        description: "normal — обычная работа; diagnose — проверка покрытия aisstream (4 мин)"
        type: choice
        options: [normal, diagnose]
        default: normal

concurrency:
  group: aistrack-${{ inputs.mode || 'normal' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Слушать АИС и обновлять aistrack.geojson
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          RUN_MINUTES: "330"
          CYCLE_SECONDS: "60"
          MODE: ${{ inputs.mode || 'normal' }}
        run: python update_aistrack.py
